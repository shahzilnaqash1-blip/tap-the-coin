<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tap The Coin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#141e30,#243b55);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.container{
    width:100%;
    max-width:500px;
}

/* SCREENS */
.screen{
    display:none;
}

.screen.active{
    display:block;
}

/* START SCREEN */
.start-card{
    text-align:center;
    padding:35px 20px;
    border-radius:28px;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.logo{
    width:105px;
    height:105px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd700,#ff9d00);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    box-shadow:0 0 30px rgba(255,215,0,.4);
}

.game-title{
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:8px;
}

.game-title span{
    display:block;
    font-size:18px;
    letter-spacing:4px;
    opacity:.75;
    margin-top:5px;
}

.subtitle{
    font-size:15px;
    opacity:.8;
    margin:18px 0 28px;
}

.challenge{
    display:inline-block;
    padding:8px 15px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    font-size:13px;
    margin-bottom:25px;
}

/* BUTTONS */
button{
    border:none;
    cursor:pointer;
    color:white;
    font-weight:bold;
    border-radius:14px;
    transition:.2s;
}

button:active{
    transform:scale(.96);
}

.start-btn{
    width:100%;
    padding:17px;
    font-size:19px;
    background:linear-gradient(135deg,#00c853,#00e676);
    box-shadow:0 8px 20px rgba(0,200,83,.25);
}

.achievement-btn{
    width:100%;
    padding:14px;
    margin-top:12px;
    font-size:16px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.2);
}

.back-btn{
    width:100%;
    padding:14px;
    margin-top:18px;
    background:rgba(255,255,255,.12);
}

/* GAME HEADER */
.game-header{
    text-align:center;
    margin-bottom:12px;
}

.game-header h1{
    font-size:30px;
    margin-bottom:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:rgba(255,255,255,.12);
    padding:10px 5px;
    border-radius:12px;
    font-size:13px;
}

.stat strong{
    display:block;
    font-size:19px;
    margin-top:3px;
}

/* GAME AREA */
#gameArea{
    position:relative;
    width:100%;
    height:min(450px,62vh);
    min-height:330px;
    margin-top:12px;
    border-radius:22px;
    overflow:hidden;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.15);
    box-shadow:inset 0 0 30px rgba(0,0,0,.2);
}

#coin,#bonusCoin{
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
    cursor:pointer;
    transition:left .15s,top .15s;
}

#coin{
    width:62px;
    height:62px;
    font-size:40px;
}

#bonusCoin{
    width:58px;
    height:58px;
    font-size:38px;
    display:none;
}

/* CONTROLS */
.controls{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.control-btn{
    flex:1;
    padding:13px;
    background:rgba(255,255,255,.12);
    font-size:15px;
}

/* GAME OVER */
.game-over-card{
    text-align:center;
    padding:35px 20px;
    border-radius:25px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.15);
}

.game-over-card h2{
    font-size:35px;
    margin-bottom:15px;
}

.final-score{
    font-size:20px;
    margin-bottom:25px;
}

.game-over-card button{
    width:100%;
    padding:15px;
    margin-top:10px;
    font-size:17px;
    background:linear-gradient(135deg,#00c853,#00e676);
}

.game-over-card .home{
    background:rgba(255,255,255,.12);
}

/* ACHIEVEMENTS */
.ach-title{
    text-align:center;
    font-size:30px;
    margin-bottom:20px;
}

.achievement{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px;
    margin-bottom:10px;
    border-radius:16px;
    background:rgba(255,255,255,.10);
}

.achievement-icon{
    font-size:32px;
}

.achievement-text{
    flex:1;
}

.achievement-text h3{
    font-size:16px;
    margin-bottom:4px;
}

.achievement-text p{
    font-size:12px;
    opacity:.7;
}

.locked{
    opacity:.45;
}

/* EFFECTS */
#comboEffect,
#levelEffect{
    position:fixed;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%) scale(.5);
    font-size:35px;
    font-weight:900;
    pointer-events:none;
    opacity:0;
    z-index:100;
}

.comboShow{
    animation:comboPop .8s ease;
}

.levelShow{
    animation:levelPop 1s ease;
}

@keyframes comboPop{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.5);
    }
    40%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.3);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes levelPop{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.5);
    }
    30%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.3);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1);
    }
}

@media(max-width:380px){
    .game-title{
        font-size:34px;
    }

    .logo{
        width:85px;
        height:85px;
        font-size:45px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- START SCREEN -->
<div id="startScreen" class="screen active">

    <div class="start-card">

        <div class="logo">🪙</div>

        <div class="game-title">
            TAP THE COIN
            <span>ULTIMATE CHALLENGE</span>
        </div>

        <div class="subtitle">
            Tap fast • Build combos • Catch bonuses • Beat your high score!
        </div>

        <div class="challenge">
            ⏱️ 30 SECOND CHALLENGE
        </div>

        <button class="start-btn" onclick="startGame()">
            ▶️ PLAY GAME
        </button>

        <button class="achievement-btn" onclick="showAchievements()">
            🏆 ACHIEVEMENTS
        </button>

    </div>

</div>


<!-- ACHIEVEMENTS SCREEN -->
<div id="achievementScreen" class="screen">

    <div class="game-over-card">

        <h2 class="ach-title">🏆 ACHIEVEMENTS</h2>

        <div id="achievementList"></div>

        <button class="back-btn" onclick="showStartScreen()">
            ⬅️ BACK
        </button>

    </div>

</div>


<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">

    <div class="game-header">

        <h1>🪙 TAP THE COIN</h1>

        <div class="stats">

            <div class="stat">
                Score
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                High
                <strong id="highScore">0</strong>
            </div>

            <div class="stat">
                Time
                <strong id="time">30</strong>
            </div>

            <div class="stat">
                Lives
                <strong id="lives">❤️❤️❤️</strong>
            </div>

            <div class="stat">
                Level
                <strong id="level">1</strong>
            </div>

            <div class="stat">
                🔥 Combo
                <strong id="combo">0</strong>
            </div>

        </div>
    </div>


    <div id="gameArea">

        <div id="coin">⭐</div>

        <div id="bonusCoin">💰</div>

    </div>


    <div class="controls">

        <button class="control-btn" onclick="togglePause()" id="pauseBtn">
            ⏸️ PAUSE
        </button>

        <button class="control-btn" onclick="toggleSound()" id="soundBtn">
            🔊 SOUND ON
        </button>

    </div>

</div>


<!-- GAME OVER -->
<div id="gameOverScreen" class="screen">

    <div class="game-over-card">

        <h2>🎮 GAME OVER</h2>

        <div class="final-score">
            Your Score: <strong id="finalScore">0</strong>
        </div>

        <button onclick="startGame()">
            🔄 PLAY AGAIN
        </button>

        <button class="home" onclick="showStartScreen()">
            🏠 HOME
        </button>

    </div>

</div>

</div>


<div id="comboEffect"></div>
<div id="levelEffect"></div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let score = 0;
let highScore = Number(localStorage.getItem("highScore")) || 0;

let timeLeft = 30;
let lives = 3;

let level = 1;

let combo = 0;
let multiplier = 1;

let gameTimer;
let coinMoveTimer;
let bonusTimer;
let bonusMoveTimer;

let bonusActive = false;
let paused = false;
let soundOn = true;

let audioContext;


/* =========================
   ELEMENTS
========================= */

const startScreen = document.getElementById("startScreen");
const achievementScreen = document.getElementById("achievementScreen");
const gameScreen = document.getElementById("gameScreen");
const gameOverScreen = document.getElementById("gameOverScreen");

const gameArea = document.getElementById("gameArea");
const coin = document.getElementById("coin");
const bonusCoin = document.getElementById("bonusCoin");

const scoreDisplay = document.getElementById("score");
const highScoreDisplay = document.getElementById("highScore");
const timeDisplay = document.getElementById("time");
const livesDisplay = document.getElementById("lives");
const levelDisplay = document.getElementById("level");
const comboDisplay = document.getElementById("combo");

const finalScore = document.getElementById("finalScore");
const pauseBtn = document.getElementById("pauseBtn");
const soundBtn = document.getElementById("soundBtn");

const comboEffect = document.getElementById("comboEffect");
const levelEffect = document.getElementById("levelEffect");


/* =========================
   SOUND
========================= */

function playSound(frequency, duration, delay = 0){

    if(!soundOn) return;

    try{

        if(!audioContext){
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if(audioContext.state === "suspended"){
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.frequency.value = frequency;
        oscillator.type = "sine";

        gain.gain.setValueAtTime(0.08, audioContext.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + delay + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(audioContext.currentTime + delay);
        oscillator.stop(audioContext.currentTime + delay + duration);

    }catch(e){}
}


function playCoinSound(){
    playSound(700,.12);
}

function playBonusSound(){
    playSound(900,.12);
    playSound(1200,.15,.12);
}

function playMissSound(){
    playSound(180,.15);
}

function playGameOverSound(){
    playSound(300,.2);
    playSound(220,.25,.2);
}

function playLevelUpSound(){
    playSound(600,.12);
    playSound(800,.12,.12);
    playSound(1000,.18,.24);
}

function playAchievementSound(){
    playSound(700,.1);
    playSound(900,.1,.1);
    playSound(1200,.2,.2);
}


/* =========================
   SCREEN FUNCTIONS
========================= */

function hideAllScreens(){

    startScreen.classList.remove("active");
    achievementScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    gameOverScreen.classList.remove("active");

}

function showStartScreen(){

    hideAllScreens();
    startScreen.classList.add("active");

}

function showAchievements(){

    hideAllScreens();
    achievementScreen.classList.add("active");

    updateAchievements();

}


/* =========================
   ACHIEVEMENTS
========================= */

const achievementData = {

    firstTap:{
        title:"First Tap",
        description:"Pehla coin tap karo",
        icon:"🥉"
    },

    tenPoints:{
        title:"10 Points",
        description:"Score 10 points",
        icon:"🥈"
    },

    twentyPoints:{
        title:"20 Points",
        description:"Score 20 points",
        icon:"🥇"
    },

    comboMaster:{
        title:"Combo Master",
        description:"x5 multiplier unlock karo",
        icon:"🔥"
    },

    bonusHunter:{
        title:"Bonus Hunter",
        description:"Bonus coin pakro",
        icon:"💰"
    }

};


let achievements =
JSON.parse(localStorage.getItem("achievements")) || {};


function unlockAchievement(id){

    if(achievements[id]) return;

    achievements[id] = true;

    localStorage.setItem(
        "achievements",
        JSON.stringify(achievements)
    );

    playAchievementSound();

}


function updateAchievements(){

    const list = document.getElementById("achievementList");

    list.innerHTML = "";

    for(const id in achievementData){

        const a = achievementData[id];

        const unlocked = achievements[id];

        const div = document.createElement("div");

        div.className =
            "achievement " + (unlocked ? "" : "locked");

        div.innerHTML = `
            <div class="achievement-icon">
                ${unlocked ? a.icon : "🔒"}
            </div>

            <div class="achievement-text">
                <h3>${a.title}</h3>
                <p>${a.description}</p>
            </div>
        `;

        list.appendChild(div);

    }

}


/* =========================
   COIN POSITION
========================= */

function moveCoin(){

    const maxX = gameArea.clientWidth - 70;
    const maxY = gameArea.clientHeight - 70;

    const x = Math.random() * Math.max(maxX,1);
    const y = Math.random() * Math.max(maxY,1);

    coin.style.left = x + "px";
    coin.style.top = y + "px";

}


function moveBonusCoin(){

    if(!bonusActive || paused) return;

    const maxX = gameArea.clientWidth - 65;
    const maxY = gameArea.clientHeight - 65;

    const x = Math.random() * Math.max(maxX,1);
    const y = Math.random() * Math.max(maxY,1);

    bonusCoin.style.left = x + "px";
    bonusCoin.style.top = y + "px";

}


/* =========================
   LEVEL SYSTEM
========================= */

function updateLevel(){

    if(score < 10){
        level = 1;
    }
    else if(score < 20){
        level = 2;
    }
    else{
        level = 3;
    }

    levelDisplay.textContent = level;

    if(level === 1){
        coin.textContent = "⭐";
    }
    else if(level === 2){
        coin.textContent = "🪙";
    }
    else{
        coin.textContent = "💎";
    }

}


function getMoveSpeed(){

    if(level === 1) return 1500;
    if(level === 2) return 1000;
    return 600;

}


function restartCoinMovement(){

    clearInterval(coinMoveTimer);

    coinMoveTimer = setInterval(function(){

        if(!paused){
            moveCoin();
        }

    },getMoveSpeed());

}


/* =========================
   COMBO
========================= */

function updateCombo(){

    if(combo >= 10){
        multiplier = 5;
    }
    else if(combo >= 5){
        multiplier = 3;
    }
    else if(combo >= 3){
        multiplier = 2;
    }
    else{
        multiplier = 1;
    }

    comboDisplay.textContent =
        combo + (multiplier > 1 ? " (x" + multiplier + ")" : "");

}


function showComboEffect(){

    if(combo !== 3 && combo !== 5 && combo !== 10) return;

    comboEffect.textContent =
        combo === 10 ? "🔥 x5 COMBO!" :
        combo === 5 ? "🔥 x3 COMBO!" :
        "🔥 x2 COMBO!";

    comboEffect.classList.remove("comboShow");

    void comboEffect.offsetWidth;

    comboEffect.classList.add("comboShow");

}


/* =========================
   LEVEL EFFECT
========================= */

function showLevelEffect(){

    if(level === 2){
        levelEffect.textContent = "🚀 LEVEL 2! 🪙";
    }
    else if(level === 3){
        levelEffect.textContent = "🔥 LEVEL 3! 💎";
    }
    else{
        return;
    }

    levelEffect.classList.remove("levelShow");

    void levelEffect.offsetWidth;

    levelEffect.classList.add("levelShow");

    playLevelUpSound();

}


/* =========================
   BONUS COIN
========================= */

function showBonusCoin(){

    if(paused || bonusActive) return;

    bonusActive = true;

    bonusCoin.style.display = "flex";

    moveBonusCoin();

    clearInterval(bonusMoveTimer);

    bonusMoveTimer = setInterval(function(){

        moveBonusCoin();

    },1000);

    setTimeout(function(){

        bonusActive = false;

        bonusCoin.style.display = "none";

        clearInterval(bonusMoveTimer);

    },3000);

}


function startBonusSystem(){

    clearInterval(bonusTimer);

    bonusTimer = setInterval(function(){

        if(!paused){
            showBonusCoin();
        }

    },7000);

}


/* =========================
   COIN CLICK
========================= */

coin.addEventListener("click",function(e){

    e.stopPropagation();

    if(paused) return;

    const oldLevel = level;

    combo++;

    updateCombo();

    score += multiplier;

    scoreDisplay.textContent = score;

    unlockAchievement("firstTap");

    if(score >= 10){
        unlockAchievement("tenPoints");
    }

    if(score >= 20){
        unlockAchievement("twentyPoints");
    }

    if(combo >= 10){
        unlockAchievement("comboMaster");
    }

    showComboEffect();

    updateLevel();

    if(level > oldLevel){
        showLevelEffect();
        restartCoinMovement();
    }

    playCoinSound();

    moveCoin();

});


/* =========================
   BONUS CLICK
========================= */

bonusCoin.addEventListener("click",function(e){

    e.stopPropagation();

    if(paused || !bonusActive) return;

    const oldLevel = level;

    score += 5;

    scoreDisplay.textContent = score;

    unlockAchievement("bonusHunter");

    updateLevel();

    if(level > oldLevel){
        showLevelEffect();
        restartCoinMovement();
    }

    playBonusSound();

    bonusActive = false;

    bonusCoin.style.display = "none";

    clearInterval(bonusMoveTimer);

});


/* =========================
   MISS / LIVES
========================= */

gameArea.addEventListener("click",function(e){

    if(paused) return;

    if(e.target === coin || e.target === bonusCoin) return;

    lives--;

    livesDisplay.textContent =
        "❤️".repeat(lives) + "🖤".repeat(3-lives);

    combo = 0;
    multiplier = 1;

    updateCombo();

    playMissSound();

    if(lives <= 0){
        endGame();
    }

});


/* =========================
   START GAME
========================= */

function startGame(){

    clearAllTimers();

    hideAllScreens();

    gameScreen.classList.add("active");

    score = 0;
    timeLeft = 30;
    lives = 3;

    level = 1;

    combo = 0;
    multiplier = 1;

    paused = false;
    bonusActive = false;

    scoreDisplay.textContent = "0";
    highScoreDisplay.textContent = highScore;
    timeDisplay.textContent = "30";

    livesDisplay.textContent = "❤️❤️❤️";

    levelDisplay.textContent = "1";
    comboDisplay.textContent = "0";

    coin.textContent = "⭐";

    bonusCoin.style.display = "none";

    pauseBtn.textContent = "⏸️ PAUSE";

    moveCoin();

    restartCoinMovement();

    startBonusSystem();

    gameTimer = setInterval(function(){

        if(paused) return;

        timeLeft--;

        timeDisplay.textContent = timeLeft;

        if(timeLeft <= 0){
            endGame();
        }

    },1000);

}


/* =========================
   PAUSE
========================= */

function togglePause(){

    paused = !paused;

    if(paused){

        pauseBtn.textContent = "▶️ RESUME";

    }
    else{

        pauseBtn.textContent = "⏸️ PAUSE";

        if(bonusActive){
            moveBonusCoin();
        }

    }

}


/* =========================
   SOUND
========================= */

function toggleSound(){

    soundOn = !soundOn;

    soundBtn.textContent =
        soundOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";

}


/* =========================
   END GAME
========================= */

function endGame(){

    clearAllTimers();

    bonusActive = false;

    bonusCoin.style.display = "none";

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "highScore",
            highScore
        );

    }

    finalScore.textContent = score;

    playGameOverSound();

    hideAllScreens();

    gameOverScreen.classList.add("active");

}


/* =========================
   CLEAR TIMERS
========================= */

function clearAllTimers(){

    clearInterval(gameTimer);
    clearInterval(coinMoveTimer);
    clearInterval(bonusTimer);
    clearInterval(bonusMoveTimer);

}


/* =========================
   INITIAL
========================= */

highScoreDisplay.textContent = highScore;

updateAchievements();

</script>

</body>
              </html>
